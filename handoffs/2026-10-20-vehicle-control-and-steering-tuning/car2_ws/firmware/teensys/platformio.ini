[platformio]
src_dir = .
default_envs = master, throttle, steer, brake

[env]
platform = teensy@5.1.0
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -DDBW_E2E_ENABLE=1
lib_deps =
    adafruit/Adafruit MCP4725 @ 2.0.2
    adafruit/Adafruit BusIO @ 1.17.4
    waspinator/AccelStepper @ 1.64
    paulstoffregen/Encoder @ 1.4.4

[env:master]
build_src_filter = -<*> +<master.cpp>

[env:throttle]
build_src_filter = -<*> +<throttle.cpp>

[env:steer]
build_src_filter = -<*> +<steer.cpp>

[env:brake]
build_src_filter = -<*> +<brake.cpp>

[env:steer_usb_jog]
build_src_filter = -<*> +<steer_usb_jog.cpp>

[env:steer_limit_test]
build_src_filter = -<*> +<steer_limit_test.cpp>

[env:steer_sensor_test]
build_src_filter = -<*> +<steer_sensor_test.cpp>

[env:throttle_usb_test]
build_src_filter = -<*> +<throttle_usb_test.cpp>

[env:brake_bench]
lib_deps =
build_src_filter = -<*> +<brake_bench_test.cpp>

[env:can_bus_test_master]
lib_deps =
build_src_filter = -<*> +<can_bus_test.cpp>
build_flags = ${env.build_flags} -DCAN_BUS_TEST_NODE=0

[env:can_bus_test_throttle]
lib_deps =
build_src_filter = -<*> +<can_bus_test.cpp>
build_flags = ${env.build_flags} -DCAN_BUS_TEST_NODE=1

[env:can_bus_test_steering]
lib_deps =
build_src_filter = -<*> +<can_bus_test.cpp>
build_flags = ${env.build_flags} -DCAN_BUS_TEST_NODE=2

[env:can_bus_test_brake]
lib_deps =
build_src_filter = -<*> +<can_bus_test.cpp>
build_flags = ${env.build_flags} -DCAN_BUS_TEST_NODE=3

[env:can_link_sender]
lib_deps =
build_src_filter = -<*> +<can_link_test.cpp>
build_flags = ${env.build_flags} -DCAN_LINK_SENDER=1

[env:can_link_responder]
lib_deps =
build_src_filter = -<*> +<can_link_test.cpp>
build_flags = ${env.build_flags} -DCAN_LINK_SENDER=0
