<text x="626.00" y="659.00" font-size="9" fill="#163047" font-weight="normal" text-anchor="start">GPIO17: firmware calls LEFT; manually holding the right-side switch activated this pin [U].</text>
<text x="626.00" y="673.00" font-size="9" fill="#163047" font-weight="normal" text-anchor="start">GPIO18: firmware calls RIGHT; manually holding the left-side switch activated this pin [U].</text>
<text x="626.00" y="687.00" font-size="9" fill="#163047" font-weight="normal" text-anchor="start">Released = LOW; pressed = HIGH [U]. Actual mechanical travel direction must be checked before using either contact as a</text>
<text x="626.00" y="701.00" font-size="9" fill="#163047" font-weight="normal" text-anchor="start">directional stop.</text>
